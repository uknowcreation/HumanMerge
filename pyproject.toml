[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-review-agent"
version = "0.1.0"
description = "A provider-neutral, human-approved pull request review agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "PR Review Agent contributors" }]
dependencies = [
  "questionary>=2.1.1,<3",
]

[project.scripts]
pr-review-agent = "pr_review_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
